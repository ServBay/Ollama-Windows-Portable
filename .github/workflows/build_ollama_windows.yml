name: Build Ollama for Windows

on:
  workflow_dispatch:
    inputs:
      ollama_version:
        description: 'The Ollama version to build (e.g., 0.1.43). The workflow will checkout tag v<version>.'
        required: true
        type: string
      dry_run:
        description: 'Build and verify without creating or updating a Release'
        required: false
        type: boolean
        default: false
      builder_dry_run:
        description: 'dry_run flag passed back to the Builder release callback (Uploader plans only when true)'
        required: false
        type: boolean
        default: true

# Elevate GITHUB_TOKEN so Create GitHub Release works; the org joined an
# enterprise that reset the repo default workflow permission to read-only.
permissions:
  contents: write

jobs:
  build:
    # CUDA 12.8 supports Visual Studio 2022, not newer MSVC releases.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout portable package checks
        uses: actions/checkout@v4

      - name: Checkout Ollama source code
        uses: actions/checkout@v4
        with:
          repository: ollama/ollama
          ref: v${{ inputs.ollama_version }}
          path: source

      - name: Test portable package checks
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          python -B -m unittest discover -s "$env:GITHUB_WORKSPACE\tests" -v
          if ($LASTEXITCODE -ne 0) {
            throw "Portable package checks failed with exit code $LASTEXITCODE."
          }

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Build and stage Ollama payload
        id: build
        shell: pwsh
        env:
          # Keep VERSION free of spaces: upstream passes it through Go ldflags.
          VERSION: ${{ inputs.ollama_version }}
          ARCH: amd64
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = "Stop"
          $payloadDir = Join-Path $env:GITHUB_WORKSPACE "staging\payload"
          New-Item -ItemType Directory -Force -Path $payloadDir | Out-Null

          Write-Host "Starting build for Ollama version: $env:VERSION"
          $hasNativePayloadBuild =
            (Test-Path ".\scripts\build_windows.ps1") -and
            (Test-Path ".\llama\server\CMakeLists.txt")

          if ($hasNativePayloadBuild) {
            Write-Host "Detected the native llama-server source layout."
            # Use the same Ninja/MSVC toolchain as the official Windows release.
            & choco install -y --no-progress ninja
            if ($LASTEXITCODE -ne 0) {
              throw "Ninja installation failed with exit code $LASTEXITCODE."
            }
            $env:CMAKE_GENERATOR = "Ninja"
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            $vsInstall = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($LASTEXITCODE -ne 0 -or -not $vsInstall) {
              throw "Visual Studio 2022 C++ tools were not found."
            }
            Import-Module (Join-Path $vsInstall "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
            Enter-VsDevShell -VsInstallPath $vsInstall -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64 -no_logo'

            # cpu clears dist; build it before adding either GPU backend.
            & .\scripts\build_windows.ps1 cpu ollama
            if ($LASTEXITCODE -ne 0) {
              throw "Upstream Windows build failed with exit code $LASTEXITCODE."
            }

            $cudaToolkits = @(
              @{
                Version = "12.8"
                Backend = "cuda12"
                Url = "https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe"
                Components = @("cudart", "nvcc", "cublas", "cublas_dev")
              },
              @{
                Version = "13.0"
                Backend = "cuda13"
                Url = "https://developer.download.nvidia.com/compute/cuda/13.0.0/local_installers/cuda_13.0.0_windows.exe"
                Components = @("cudart", "nvcc", "cublas", "cublas_dev", "crt", "nvvm", "nvptxcompiler")
              }
            )
            $ProgressPreference = 'SilentlyContinue'
            foreach ($toolkit in $cudaToolkits) {
              $installer = Join-Path $env:RUNNER_TEMP "cuda-$($toolkit.Version)-installer.exe"
              try {
                Invoke-WebRequest -Uri $toolkit.Url -OutFile $installer
                $components = @($toolkit.Components | ForEach-Object { "${_}_$($toolkit.Version)" })
                $installation = Start-Process -FilePath $installer -ArgumentList (@("-s") + $components) -NoNewWindow -PassThru -Wait
                if ($installation.ExitCode -ne 0) {
                  throw "CUDA $($toolkit.Version) installation failed with exit code $($installation.ExitCode)."
                }
              }
              finally {
                # Remove only this downloaded installer to leave room for the ZIP.
                if (Test-Path -LiteralPath $installer -PathType Leaf) {
                  Remove-Item -LiteralPath $installer -Force
                }
              }

              # Upstream silently skips CUDA when no toolkit is found. Fail here
              # instead, and check the final backend DLLs with the shared validator.
              $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$($toolkit.Version)"
              $nvcc = Join-Path $cudaRoot "bin\nvcc.exe"
              if (-not (Test-Path -LiteralPath $nvcc -PathType Leaf)) {
                throw "CUDA $($toolkit.Version) installation did not provide nvcc.exe."
              }
              $nvccVersion = & $nvcc --version
              if ($LASTEXITCODE -ne 0 -or ($nvccVersion -join "`n") -notmatch "release $([regex]::Escape($toolkit.Version)),") {
                throw "Unexpected nvcc version for CUDA $($toolkit.Version): $nvccVersion"
              }
              & .\scripts\build_windows.ps1 $toolkit.Backend
              if ($LASTEXITCODE -ne 0) {
                throw "Upstream $($toolkit.Backend) build failed with exit code $LASTEXITCODE."
              }
            }

            $distDir = Join-Path $env:GITHUB_WORKSPACE "source\dist\windows-amd64"
            if (-not (Test-Path $distDir -PathType Container)) {
              throw "Upstream build did not create the expected payload: $distDir"
            }

            Copy-Item -Path (Join-Path $distDir "*") -Destination $payloadDir -Recurse -Force
            $buildLayout = "native"
          }
          else {
            Write-Host "Legacy source layout detected; using the Go-only fallback."
            $outputFile = Join-Path $payloadDir "ollama.exe"
            $ldflags = "-s -w -X=github.com/ollama/ollama/version.Version=$env:VERSION -X=github.com/ollama/ollama/server.mode=release"

            & go build -trimpath -ldflags $ldflags -o $outputFile .
            if ($LASTEXITCODE -ne 0) {
              throw "Legacy Go build failed with exit code $LASTEXITCODE."
            }
            $buildLayout = "legacy"
          }

          # Upstream builds ollama.exe with CGO_ENABLED=1, which links it against
          # the MinGW runtime (libwinpthread-1.dll, ...). Those DLLs sit on the
          # CI runner's PATH but not on end-user machines, so ollama.exe dies
          # with STATUS_DLL_NOT_FOUND (0xC0000135) at launch. Locate the Go cgo
          # compiler and stage its MinGW runtime DLLs next to ollama.exe.
          $gcc = Get-Command gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gcc) {
            throw "gcc.exe not found on PATH; cannot stage MinGW runtime for ollama.exe."
          }
          $gccDir = Split-Path -Parent $gcc.Path
          Write-Host "Staging MinGW runtime DLLs from: $gccDir"
          $mingwRuntimeDlls = @(
            "libwinpthread-1.dll",
            "libgcc_s_seh-1.dll",
            "libgcc_s_dw2-1.dll",
            "libstdc++-6.dll"
          )
          $stagedRuntimeDlls = @()
          foreach ($dll in $mingwRuntimeDlls) {
            $src = Join-Path $gccDir $dll
            if (Test-Path $src -PathType Leaf) {
              Copy-Item -Path $src -Destination (Join-Path $payloadDir $dll) -Force
              $stagedRuntimeDlls += $dll
              Write-Host "  staged $dll"
            }
          }
          if ($stagedRuntimeDlls.Count -eq 0) {
            throw "No MinGW runtime DLLs found next to gcc.exe; ollama.exe would fail to launch on end-user machines."
          }
          "STAGED_MINGW_DLLS=$($stagedRuntimeDlls -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          "BUILD_LAYOUT=$buildLayout" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Build completed using the $buildLayout layout."

      - name: Verify build output
        shell: pwsh
        env:
          BUILD_LAYOUT: ${{ steps.build.outputs.BUILD_LAYOUT }}
        run: |
          $ErrorActionPreference = "Stop"
          $payloadDir = Join-Path $env:GITHUB_WORKSPACE "staging\payload"
          $validator = Join-Path $env:GITHUB_WORKSPACE ".github\scripts\verify_payload.py"
          & python $validator --payload $payloadDir --layout $env:BUILD_LAYOUT
          if ($LASTEXITCODE -ne 0) {
            throw "Payload verification failed with exit code $LASTEXITCODE."
          }

          # Reproduce an end-user machine by scrubbing PATH down to the two
          # Windows system dirs. The CI runner ships with MinGW on PATH, which
          # would otherwise hide missing MinGW runtime DLLs inside the payload.
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Write-Host "Verifying with isolated PATH: $env:PATH"

            Write-Host "Checking ollama.exe version..."
            & (Join-Path $payloadDir "ollama.exe") --version
            if ($LASTEXITCODE -ne 0) {
              throw "ollama.exe --version failed with exit code $LASTEXITCODE under an isolated PATH; the payload is missing a runtime DLL."
            }

            if ($env:BUILD_LAYOUT -eq "native") {
              Write-Host "Checking llama-server.exe and its bundled DLL dependencies..."
              & (Join-Path $payloadDir "lib\ollama\llama-server.exe") --version
              if ($LASTEXITCODE -ne 0) {
                throw "llama-server.exe --version failed with exit code $LASTEXITCODE under an isolated PATH; the payload is missing a runtime DLL."
              }
            }
          } finally {
            $env:PATH = $originalPath
          }

          Write-Host "Payload contents:"
          Get-ChildItem -Path $payloadDir -Recurse -File |
            ForEach-Object { $_.FullName.Substring($payloadDir.Length + 1) }

      - name: Package the payload into a ZIP file
        id: package
        shell: pwsh
        env:
          BUILD_LAYOUT: ${{ steps.build.outputs.BUILD_LAYOUT }}
          OLLAMA_VERSION: ${{ inputs.ollama_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $zipFileName = "ollama-$env:OLLAMA_VERSION-win-x64.zip"
          $zipFilePath = Join-Path $env:GITHUB_WORKSPACE $zipFileName
          $payloadDir = Join-Path $env:GITHUB_WORKSPACE "staging\payload"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($payloadDir, $zipFilePath)
          $validator = Join-Path $env:GITHUB_WORKSPACE ".github\scripts\verify_payload.py"
          & python $validator --archive $zipFilePath --layout $env:BUILD_LAYOUT
          if ($LASTEXITCODE -ne 0) {
            throw "ZIP verification failed with exit code $LASTEXITCODE."
          }

          Write-Host "Created ZIP package: $zipFileName"
          
          echo "ZIP_FILE_NAME=$zipFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "ZIP_FILE_PATH=$zipFilePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Save dry-run package
        if: ${{ success() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ollama-${{ inputs.ollama_version }}-win-x64-dryrun
          path: ${{ steps.package.outputs.ZIP_FILE_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: ${{ success() && inputs.dry_run == false }}
        with:
          tag_name: v${{ inputs.ollama_version }}
          name: Ollama ${{ inputs.ollama_version }} for Windows x64 (ServBay Build)
          body: |
            This is a custom build of Ollama **v${{ inputs.ollama_version }}** for Windows x64.

          draft: false
          prerelease: false
          files: ${{ steps.package.outputs.ZIP_FILE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Builder release is ready
        # Fired only when a release was actually published (dry_run builds
        # create none). ServBay/ServBay-PKG-Builder-v1's
        # build-windows-async.yml repackages the release and hands it to the
        # Uploader. BUILDER_DISPATCH_PAT needs contents:write on that repo.
        # Failing loudly is safe: the Builder nightly self-heals through its
        # release-already-built path if this callback is lost.
        if: ${{ success() && inputs.dry_run == false }}
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.BUILDER_DISPATCH_PAT }}
          BUILDER_REPO: ServBay/ServBay-PKG-Builder-v1
          OLLAMA_VERSION: ${{ inputs.ollama_version }}
          BUILDER_DRY_RUN: ${{ inputs.builder_dry_run }}
        run: |
          $ErrorActionPreference = "Stop"
          gh api "repos/$env:BUILDER_REPO/dispatches" `
            -f event_type=upstream-release-ready `
            -f "client_payload[pkg]=ollama" `
            -f "client_payload[version]=$env:OLLAMA_VERSION" `
            -f "client_payload[arch]=x64" `
            -f "client_payload[os]=windows" `
            -f "client_payload[dry_run]=$env:BUILDER_DRY_RUN"
          if ($LASTEXITCODE -ne 0) {
            throw "Builder dispatch failed with exit code $LASTEXITCODE."
          }
